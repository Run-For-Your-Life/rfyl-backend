name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - "rfyl-backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "rfyl-backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    environment: cloudsql-connect

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_CONNECTION_LIMIT: 5
      DB_SOCKET_PATH: ""
      CLOUDSQL_AUTOSTART_PROXY: "false"

    defaults:
      run:
        working-directory: rfyl-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: rfyl-backend/package-lock.json

      - name: Install MySQL client and curl
        run: sudo apt-get update && sudo apt-get install -y mysql-client curl netcat-openbsd

      - name: Download Cloud SQL Proxy
        run: |
          curl -sSL -o cloud-sql-proxy https://storage.googleapis.com/cloud-sql-connectors/cloud-sql-proxy/v2.13.0/cloud-sql-proxy.linux.amd64
          chmod +x cloud-sql-proxy
          sudo mv cloud-sql-proxy /usr/local/bin/cloud-sql-proxy

      - name: Write service account key
        run: |
          echo "${{ secrets.CLOUDSQL_SA_JSON_B64 }}" | base64 --decode > /tmp/cloudsql-key.json
          chmod 600 /tmp/cloudsql-key.json

      - name: Start Cloud SQL Proxy
        run: |
          nohup cloud-sql-proxy --credentials-file=/tmp/cloudsql-key.json --port=${DB_PORT} ${{ secrets.CLOUDSQL_CONNECTION_NAME }} >/tmp/cloudsql-proxy.log 2>&1 &
          echo "Cloud SQL Proxy started in background"

      - name: Install dependencies
        run: npm ci

      - name: Seed database schema
        run: |
          echo "Waiting 10 seconds for Cloud SQL Proxy to be ready..."
          sleep 10
          mysql -h 127.0.0.1 -P ${DB_PORT} -u"${DB_USER}" -p"${DB_PASSWORD}" "${DB_NAME}" < src/db/runforyourlife_db.sql

      - name: Run tests
        run: npm test

name: backend-ci

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./rfyl-backend
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: password
      DB_NAME: runforyourlife_db
      CLOUDSQL_AUTOSTART_PROXY: "false"

    services:
      mysql:
        image: mysql:8.0
        ports: [3306:3306]
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: runforyourlife_db
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./rfyl-backend/package-lock.json

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Install deps
        run: npm ci

      - name: Seed schema
        run: mysql -h 127.0.0.1 -P 3306 -uroot -ppassword runforyourlife_db < src/db/runforyourlife_db.sql

      - name: Run unit and gameplay tests
        run: npm test

      - name: Run DB integration tests
        run: |
          node tests/auth.integration.test.js
          node tests/realtime.persistence.integration.test.js
          node tests/leaderboard.integration.test.js
